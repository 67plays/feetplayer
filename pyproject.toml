[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feetplayer"
version = "0.1.0"
description = "The codecs and audio output FeetBrowser plays media with"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "67plays" }]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Fortran",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]

# Nothing. The decoders are Fortran compiled at install time and the audio
# output is ctypes against libraries the operating system already has.
#
# Motion JPEG and QuickTime `png ` can use `feetbrowser_engine` for their
# image decoding if it happens to be installed, and refuse by name if it is
# not. It is deliberately not listed here, even as an extra: it is
# FeetBrowser's own Rust extension, FeetBrowser depends on this package, and
# naming it would close that loop into a cycle -- installing feetplayer
# would fetch a second copy of an engine the browser's own checkout already
# built, pinned to a sha going stale from the moment it was written.
dependencies = []

[project.urls]
Homepage = "https://github.com/67plays/feetplayer"

[tool.setuptools]
packages = ["feetplayer"]

# The Fortran ships as sources, always, even when a library was built here:
# `prebuilt_name()` is a hash of these files, so a decoder that cannot see
# them cannot work out what it is called.
[tool.setuptools.package-data]
feetplayer = ["fortran/*.f", "fortran/*.inc"]
